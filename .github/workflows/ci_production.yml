name: CI/CD Pipeline - Production

on:
  pull_request:
    branches: [production]
    types: [closed]

permissions:
  contents: write

jobs:
  production-pipeline:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # 2. CALCULAR NOVA TAG REL
      # ─────────────────────────────────────────
      - name: Calcular nova tag REL
        id: tag
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Branch de origem: $SOURCE_BRANCH"

          git fetch --tags

          if [[ "$SOURCE_BRANCH" == hotfix* ]]; then
            # ── HOTFIX: incrementa Z em rel-X.Y.Z ─────────────────────────────

            LATEST_XY=$(git tag --list 'rel-*' \
              | grep -E '^rel-[0-9]+\.[0-9]+$' \
              | sed 's/^rel-//' \
              | awk -F. '{ printf "%05d.%05d\t%s\n", $1, $2, $0 }' \
              | sort -t$'\t' -k1,1 -rn \
              | head -1 \
              | awk -F$'\t' '{print $2}')

            if [ -z "$LATEST_XY" ]; then
              echo "Nenhuma tag rel-X.Y encontrada, começando em rel-1.0"
              LATEST_XY="1.0"
              LATEST_Z=""
            else
              echo "Maior X.Y detectado: $LATEST_XY"

              LATEST_Z=$(git tag --list "rel-${LATEST_XY}.*" \
                | grep -E "^rel-${LATEST_XY//./\\.}\.[0-9]+$" \
                | sed "s/^rel-${LATEST_XY//./\\.}\.//" \
                | sort -n \
                | tail -1)
            fi

            if [ -z "$LATEST_Z" ]; then
              NEW_Z=1
            else
              NEW_Z=$((LATEST_Z + 1))
            fi

            NEW_TAG="rel-${LATEST_XY}.${NEW_Z}"

          else
            # ── STAGING → PRODUCTION: incrementa Y em rel-X.Y ─────────────────

            LATEST_TAG=$(git tag --list 'rel-*' \
              | grep -E '^rel-[0-9]+\.[0-9]+$' \
              | sed 's/^rel-//' \
              | awk -F. '{ printf "%05d.%05d\t%s\n", $1, $2, $0 }' \
              | sort -t$'\t' -k1,1 -rn \
              | head -1 \
              | awk -F$'\t' '{print $2}')

            echo "Maior rel-X.Y detectado: rel-$LATEST_TAG"

            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="rel-1.0"
            else
              X=$(echo "$LATEST_TAG" | cut -d. -f1)
              Y=$(echo "$LATEST_TAG" | cut -d. -f2)
              NEW_Y=$((Y + 1))
              NEW_TAG="rel-${X}.${NEW_Y}"
            fi
          fi

          echo "Nova tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      # 3. JDK
      # ─────────────────────────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────
      # 4. DEPENDÊNCIAS
      # ─────────────────────────────────────────
      - name: Tornar mvnw executável
        working-directory: jbank
        run: chmod +x mvnw

      - name: Resolver dependências
        working-directory: jbank
        run: ./mvnw -B dependency:resolve

      # ─────────────────────────────────────────
      # 5. BUILD
      # ─────────────────────────────────────────
      - name: Build do sistema
        working-directory: jbank
        run: ./mvnw -B compile

      # ─────────────────────────────────────────
      # 6. QUALITY — PMD (análise estática)
      # ─────────────────────────────────────────
      - name: Análise estática com PMD
        working-directory: jbank
        run: ./mvnw -B pmd:check
        continue-on-error: true

      # ─────────────────────────────────────────
      # 7. TESTES UNITÁRIOS
      # ─────────────────────────────────────────
      - name: Executar testes unitários
        working-directory: jbank
        run: ./mvnw -B test

      # ─────────────────────────────────────────
      # 8. EMPACOTAR
      # ─────────────────────────────────────────
      - name: Empacotar aplicação
        working-directory: jbank
        run: ./mvnw -B package -DskipTests

      - name: Criar ZIP do artefato
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          mkdir -p dist
          cp jbank/target/*.jar dist/
          zip -j "dist/${TAG}.zip" jbank/target/*.jar

      # ─────────────────────────────────────────
      # 9. PUBLICAR ARTIFACT NO WORKFLOW
      # ─────────────────────────────────────────
      - name: Publicar artefato no workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.new_tag }}
          path: dist/${{ steps.tag.outputs.new_tag }}.zip
          retention-days: 30

      # ─────────────────────────────────────────
      # 10. DOCKER — BUILD E PUSH
      # ─────────────────────────────────────────
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./jbank
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jbank:${{ steps.tag.outputs.new_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jbank:latest

      # ─────────────────────────────────────────
      # 11. CRIAR E PUBLICAR TAG GIT
      # ─────────────────────────────────────────
      - name: Criar e publicar tag REL
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG=${{ steps.tag.outputs.new_tag }}
          git tag "$TAG"
          git push origin "$TAG"