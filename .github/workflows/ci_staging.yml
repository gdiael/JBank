name: CI/CD Pipeline - Staging

on:
  pull_request:
    branches: [staging]
    types: [closed]

permissions:
  contents: write

jobs:
  staging-pipeline:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # 2. CALCULAR NOVA TAG RC
      # ─────────────────────────────────────────
      - name: Calcular nova tag RC
        id: tag
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Branch de origem: $SOURCE_BRANCH"

          # Busca todas as tags rc existentes
          git fetch --tags

          if [[ "$SOURCE_BRANCH" == bugfix* ]]; then
            # ── BUGFIX: incrementa Z em rc-X.Y.Z ──────────────────────────────

            # Pega o rc-X.Y mais recente (apenas tags de 2 níveis, ignora Z)
            LATEST_XY=$(git tag --list 'rc-*' \
              | grep -E '^rc-[0-9]+\.[0-9]+$' \
              | sed 's/^rc-//' \
              | awk -F. '{ printf "%05d.%05d\t%s\n", $1, $2, $0 }' \
              | sort -t$'\t' -k1,1 -rn \
              | head -1 \
              | awk -F$'\t' '{print $2}')

            if [ -z "$LATEST_XY" ]; then
              echo "Nenhuma tag rc-X.Y encontrada, começando em rc-1.0"
              LATEST_XY="1.0"
              LATEST_Z=""
            else
              echo "Maior X.Y detectado: $LATEST_XY"

              # Entre as tags com esse X.Y, acha o maior Z
              LATEST_Z=$(git tag --list "rc-${LATEST_XY}.*" \
                | grep -E "^rc-${LATEST_XY//./\\.}\.[0-9]+$" \
                | sed "s/^rc-${LATEST_XY//./\\.}\.//" \
                | sort -n \
                | tail -1)
            fi

            if [ -z "$LATEST_Z" ]; then
              # Existe rc-X.Y sem Z → Z começa em 0, nova tag é X.Y.1
              NEW_Z=1
            else
              NEW_Z=$((LATEST_Z + 1))
            fi

            NEW_TAG="rc-${LATEST_XY}.${NEW_Z}"

          else
            # ── MAIN → STAGING: incrementa Y em rc-X.Y ────────────────────────

            LATEST_TAG=$(git tag --list 'rc-*' \
              | grep -E '^rc-[0-9]+\.[0-9]+$' \
              | sed 's/^rc-//' \
              | awk -F. '{ printf "%05d.%05d\t%s\n", $1, $2, $0 }' \
              | sort -t$'\t' -k1,1 -rn \
              | head -1 \
              | awk -F$'\t' '{print $2}')

            echo "Maior rc-X.Y detectado: rc-$LATEST_TAG"

            if [ -z "$LATEST_TAG" ]; then
              # Nenhuma tag rc existe ainda → começa em rc-1.0
              NEW_TAG="rc-1.0"
            else
              X=$(echo "$LATEST_TAG" | cut -d. -f1)
              Y=$(echo "$LATEST_TAG" | cut -d. -f2)
              NEW_Y=$((Y + 1))
              NEW_TAG="rc-${X}.${NEW_Y}"
            fi
          fi

          echo "Nova tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────
      # 3. JDK
      # ─────────────────────────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────
      # 4. DEPENDÊNCIAS
      # ─────────────────────────────────────────
      - name: Tornar mvnw executável
        working-directory: jbank
        run: chmod +x mvnw

      - name: Resolver dependências
        working-directory: jbank
        run: ./mvnw -B dependency:resolve

      # ─────────────────────────────────────────
      # 5. BUILD
      # ─────────────────────────────────────────
      - name: Build do sistema
        working-directory: jbank
        run: ./mvnw -B compile

      # ─────────────────────────────────────────
      # 6. QUALITY — PMD (análise estática)
      # ─────────────────────────────────────────
      - name: Análise estática com PMD
        working-directory: jbank
        run: ./mvnw -B pmd:check
        continue-on-error: true

      # ─────────────────────────────────────────
      # 7. TESTES UNITÁRIOS
      # ─────────────────────────────────────────
      - name: Executar testes unitários
        working-directory: jbank
        run: ./mvnw -B test

      # ─────────────────────────────────────────
      # 8. EMPACOTAR
      # ─────────────────────────────────────────
      - name: Empacotar aplicação
        working-directory: jbank
        run: ./mvnw -B package -DskipTests

      - name: Criar ZIP do artefato
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          mkdir -p dist
          cp jbank/target/*.jar dist/
          zip -j "dist/${TAG}.zip" jbank/target/*.jar

      # ─────────────────────────────────────────
      # 9. PUBLICAR ARTIFACT NO WORKFLOW
      # ─────────────────────────────────────────
      - name: Publicar artefato no workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.new_tag }}
          path: dist/${{ steps.tag.outputs.new_tag }}.zip
          retention-days: 30

      # ─────────────────────────────────────────
      # 10. CRIAR E PUBLICAR TAG GIT
      # ─────────────────────────────────────────
      - name: Criar e publicar tag RC
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          TAG=${{ steps.tag.outputs.new_tag }}
          git tag "$TAG"
          git push origin "$TAG"
          