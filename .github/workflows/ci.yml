name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolver dependências
        working-directory: jbank
        run: ./mvnw dependency:resolve

      - name: Build do sistema
        working-directory: jbank
        run: ./mvnw compile

      - name: Executar testes unitários
        working-directory: jbank
        run: ./mvnw test

      - name: Build da imagem Docker
        working-directory: jbank
        run: docker build -t jbank:${{ github.run_number }} .

      - name: Criar e publicar tag
        if: success()
        run: |
          TAG="build-${{ github.run_number }}"
          git tag $TAG
          git push origin $TAG